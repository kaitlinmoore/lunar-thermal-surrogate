[project]
name = "lunar-thermal-surrogate"
version = "0.1.0"
description = "1D lunar regolith heat solver driven by terrain-shadowed illumination, with a PhysicsNeMo FNO surrogate."
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "src/lss/LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "nvidia-physicsnemo>=2.3.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "spiceypy>=8.4.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Two top-level modules: this project's own code, and the illumination engine copied unchanged
# from Penumbra Luna (src/lss/VENDORED.md).
module-name = ["lunar_thermal", "lss"]

# PyTorch comes from PyTorch's own CUDA 13.0 wheel index. `explicit = true` means
# only packages pinned to this index in [tool.uv.sources] are taken from it;
# everything else still comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU (skipped when CUDA is unavailable)",
    "data: needs LSS_DATA_DIR data; skipped when absent",
    "slow: takes more than a few seconds (deselect with -m 'not slow')",
]

[dependency-groups]
dev = [
    "heat1d @ git+https://github.com/phayne/heat1d@5b73a6c1ba5047f59f6210185b37539e46e68136#subdirectory=python",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
